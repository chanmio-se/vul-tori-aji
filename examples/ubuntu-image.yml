# Ubuntu ベースイメージを管理しているリポジトリ用。
# リポジトリ内の Dockerfile と、レジストリ上のベースイメージの両方をスキャンする。
name: CVE scan (Ubuntu base image)

on:
  schedule:
    - cron: "10 18 * * *"
  workflow_dispatch:

# reusable workflow は呼び出し元の permission 以上を要求できないため、ここでも付与する。
permissions:
  contents: read
  packages: read
  copilot-requests: write

jobs:
  trivy:
    # reusable workflow の呼び出しは actions.lock の対象外のため commit SHA で固定する
    uses: <OWNER>/vul-tori-aji/.github/workflows/trivy-scan.yml@<COMMIT_SHA>
    with:
      central_repo: <OWNER>/vul-tori-aji
      target_name: ubuntu-base
      scan_type: both
      scan_ref: "."
      image_refs: |
        ubuntu:24.04
        ghcr.io/<OWNER>/base-ubuntu:22.04
      enable_misconfig: true
    secrets: inherit
