name: test

on:
  push:
    paths:
      - "lib/**"
      - "bin/**"
      - "spec/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "lib/**"
      - "bin/**"
      - "spec/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
